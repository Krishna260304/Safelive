services:
  mongodb:
    image: mongo:6
    container_name: safelive-mongo
    restart: always

  backend:
    build: ./Backend
    container_name: safelive-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./Frontend
    container_name: safelive-frontend
    ports:
      - "8080:80"
    env_file:
      - ./Frontend/.env
    restart: always
